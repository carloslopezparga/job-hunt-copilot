# Companies whose PUBLIC job boards the copilot reads.
#
#   name:    display name
#   ats:     greenhouse | lever | ashby
#   slug:    board token / handle as it appears in the public careers URL
#              greenhouse -> boards.greenhouse.io/<slug>  or job-boards.greenhouse.io/<slug>
#              lever      -> jobs.lever.co/<slug>  (jobs.eu.lever.co/<slug> => region: eu)
#              ashby      -> jobs.ashbyhq.com/<slug>
#   sector:  ai_tech | quant_trading | investment_banking | consulting | fintech
#   region:  (lever only) "eu" for EU-hosted Lever accounts
#
# Check every board against the live APIs with:
#     jobhunt check-boards                 # this file
#     jobhunt check-boards --file companies.candidates.yaml --promote companies.yaml
# Companies change ATS from time to time; boards that 404 or stay empty should go.
#
# Removed after the first real run (2026-10): Google DeepMind (greenhouse/deepmind),
# Plaid (lever/plaid) and Belvedere Trading (greenhouse/belvederetrading) returned 404;
# Mistral AI (lever/mistral) returned 0 postings - Mistral now appears to publish on
# Ashby as "mistral.ai" (see companies.candidates.yaml, pending verification).
#
# Note on investment banking and MBB consulting: bulge-bracket banks and
# McKinsey/BCG/Bain recruit through Workday/Oracle/in-house portals, which have
# no public JSON API. Track those with `jobhunt add` (manual entry) instead.

companies:
  # ---------------------------------------------------------------- AI / tech
  - {name: Anthropic,        ats: greenhouse, slug: anthropic,   sector: ai_tech}
  - {name: OpenAI,           ats: ashby,      slug: openai,      sector: ai_tech}
