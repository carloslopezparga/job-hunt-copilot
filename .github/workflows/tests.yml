name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest -q

      - name: Offline end-to-end demo
        env:
          JOBHUNT_TODAY: "2026-10-07"
          JOBHUNT_PROFILE: profile.example.yaml
          JOBHUNT_COMPANIES: tests/fixtures/companies.sample.yaml
        run: |
          jobhunt discover --fixtures tests/fixtures
          jobhunt score
          jobhunt prepare --top 2
          jobhunt export output/applications.csv
