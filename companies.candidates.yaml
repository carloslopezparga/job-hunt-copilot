# CANDIDATE employers - NOT used by `jobhunt discover`.
#
# Staging area for NEW employers: add entries under `companies:` (with the public
# job-board URL in `notes`), verify them against the live APIs and promote the good ones:
#
#     jobhunt check-boards --file companies.candidates.yaml --promote companies.yaml
#
# Only boards that answer with real postings, at least one of them in a place an
# EU citizen can work without a visa (--min-eu-jobs, default 1), are appended to
# companies.yaml; then delete them from here. Search snippets can be stale, so expect some
# to fail.
#
# Not covered here on purpose: investment banks (Citi, BofA, Barclays, Goldman,
# Nomura, Alantra, Arcano...) recruit in Madrid through their own portals, which
# have no public API. Track those offers with `jobhunt add`.

