[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunt-copilot"
version = "0.1.0"
description = "Human-in-the-loop internship search assistant: discovers, scores and prepares applications. Never sends anything."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pypdf>=4", "ruff>=0.5"]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhunt = ["generator/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
